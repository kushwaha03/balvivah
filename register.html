<section>
    <h2><span class="lang-en">Create Your Free Profile</span><span class="lang-hi">अपनी मुफ्त प्रोफ़ाइल बनाएं</span></h2>
    <form>
        <input type="text" placeholder="Full Name / पूरा नाम" required><br><br>
        <input type="email" placeholder="Email / ईमेल" required><br><br>
        <input type="password" placeholder="Password / पासवर्ड" required><br><br>
        <input type="date" placeholder="Date of Birth / जन्म तिथि" required><br><br>
        <select required>
            <option value=""><span class="lang-en">Gender / लिंग</span></option>
            <option value="male"><span class="lang-en">Male / पुरुष</span></option>
            <option value="female"><span class="lang-en">Female / महिला</span></option>
        </select><br><br>
        <button type="submit"><span class="lang-en">Register</span><span class="lang-hi">रजिस्टर करें</span></button>
    </form>
</section>
